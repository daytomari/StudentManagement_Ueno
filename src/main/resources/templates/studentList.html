<!DOCTYPE html>
<html xmlns:th="http://www.thymelesf.org">

<head>
  <meta charset="UTF-8">
  <title>受講生一覧</title>
</head>
<body>
<h1>受講生一覧</h1>
<table boder="1">
  <thead>
  <tr>
    <th>ID</th>
    <th>名前</th>
    <th>カナ名</th>
    <th>ニックネーム</th>
    <th>メールアドレス</th>
    <th>地域</th>
    <th>年齢</th>
    <th>性別</th>
    <th>備考</th>
    <th>学歴</th>
    <th>職業</th>


  </tr>
  </thead>
  <tbody>
  <tr th:each="studentDetail : ${studentList}">
    <td th:text="${studentDetail.student.id}">1</td>
    <td th:text="${studentDetail.student.name}">龍中川</td>
    <td th:text="${studentDetail.student.kanaName}">リュウナカガワ</td>
    <td th:text="${studentDetail.student.nickname}">リュウ</td>
    <td th:text="${studentDetail.student.email}">master</td>
    <td th:text="${studentDetail.student.area}">滋賀</td>
    <td th:text="${studentDetail.student.age}">34</td>
    <td th:text="${studentDetail.student.sex}">男性</td>
    <td th:text="${studentDetail.student.remark}">備考</td>
    <td th:text="${studentDetail.student.educational}">学歴</td>
    <td th:text="${studentDetail.student.occupation}">職業</td>

  </tr>
  </tbody>
</table>

</body>
</html>
